; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Pick which demo to build/upload: env2, light, imu or pir
default_envs = pir

[env]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
lib_deps =
	m5stack/M5Unified@^0.2.28

; ENV II unit on Port A
[env:env2]
build_src_filter = +<env2_demo.cpp>
lib_deps =
	${env.lib_deps}
	m5stack/M5Unit-ENV@^1.7.3

; Light unit on Port B
[env:light]
build_src_filter = +<light_demo.cpp>

; Built-in IMU
[env:imu]
build_src_filter = +<imu_demo.cpp>

; PIR motion unit on Port B
[env:pir]
build_src_filter = +<pir_demo.cpp>
